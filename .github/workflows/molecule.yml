---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        distro:
          - ubuntu2604
        scenario:
          - default
          # Do not run the scenario with MariaDB as it is expected to fail. See: https://github.com/semaphoreui/semaphore/issues/3726
          # - mariadb
          - postgres
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: semaphore

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: semaphore/.python-version
          cache: pip
          cache-dependency-path: semaphore/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: semaphore
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          # Every scenario brings its own requirements, so the key has to cover
          # all of them - keying on the `default` scenario alone would serve a
          # stale cache to the other scenarios when only their requirements change.
          key: ansible-collections-${{ hashFiles('semaphore/molecule/*/requirements.yml') }}

      - name: Run Molecule
        working-directory: semaphore
        run: molecule test --scenario-name ${{ matrix.scenario }}
