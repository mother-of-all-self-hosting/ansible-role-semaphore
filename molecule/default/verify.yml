---
- name: Verify Semaphore UI
  hosts: all
  become: true
  gather_facts: false

  vars:
    semaphore_verify_base_url: http://localhost:3000
    semaphore_verify_project_name: molecule-verify-project

  tasks:
    - name: Run the shared Semaphore UI verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
